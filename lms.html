<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiCourse LMS</title><style>body{margin:0;font-family:Arial;background:#f5f7ff;color:#182033}.hero{padding:35px 6%;color:#fff;background:linear-gradient(135deg,#5b2cff,#8d4cff)}.wrap{padding:25px 6%}.box,.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 6px 22px #0001}.box{max-width:430px;margin:auto}.box input,.box button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}.btn{background:#6633ee;color:#fff;border:0;border-radius:9px;padding:12px 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.lesson{margin-top:12px;padding:15px;background:#f1efff;border-radius:10px}.hidden{display:none}.muted{color:#666}</style></head><body><section class="hero"><h1>🎓 DigiCourse LMS</h1><p>Student Learning Portal</p></section><main class="wrap"><div id="login" class="box"><h2>👨‍🎓 Student Login / Register</h2><input id="name" placeholder="Student Name"><input id="email" type="email" placeholder="Email"><button class="btn" onclick="loginStudent()">Login / Register</button><p id="msg"></p></div><div id="dashboard" class="hidden"><h2>Welcome, <span id="welcome"></span> 👋</h2><h2>📚 Courses</h2><div id="courses" class="cards">Loading...</div></div></main><script>
const URL="https://qobwcoopjubdloduxgrz.supabase.co",KEY="sb_publishable_4CUQ-Y8BWK7N_0rXZYJFDg_kLkcnbQJ";
async function get(t,q){let r=await fetch(URL+"/rest/v1/"+t+q,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw Error(await r.text());return r.json()}
async function loginStudent(){let n=name.value.trim(),e=email.value.trim();if(!n||!e){msg.textContent="Name और Email भरें";return}try{let a=await get("students","?email=eq."+encodeURIComponent(e)+"&select=*");let s=a[0];if(!s){let r=await fetch(URL+"/rest/v1/students",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({name:n,email:e})});if(!r.ok)throw Error(await r.text());s=(await r.json())[0]}login.classList.add("hidden");dashboard.classList.remove("hidden");welcome.textContent=s.name;loadCourses()}catch(x){msg.textContent="Database error: "+x.message}}
async function loadCourses(){try{let a=await get("courses","?select=id,title,description,price&order=created_at");courses.innerHTML=a.map(c=>`<div class="card"><h3>📚 ${esc(c.title)}</h3><p>${esc(c.description||"")}</p><b>₹${c.price}</b><br><br><button class="btn" onclick="lessons('${c.id}',this)">View Lessons</button><div></div></div>`).join("")}catch(x){courses.textContent="Courses load error: "+x.message}}
async function lessons(id,b){let box=b.nextElementSibling;box.innerHTML="Loading...";try{let a=await get("lessons","?course_id=eq."+id+"&select=title,description,video_url,pdf_url,lesson_order&order=lesson_order");box.innerHTML=a.length?a.map(l=>`<div class="lesson"><b>📖 ${esc(l.title)}</b><p>${esc(l.description||"")}</p>${l.video_url?`<a href="${l.video_url}" target="_blank">🎥 Video</a>`:""} ${l.pdf_url?`<a href="${l.pdf_url}" target="_blank">📄 PDF</a>`:""}</div>`).join(""):"No lessons yet."}catch(x){box.textContent=x.message}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
