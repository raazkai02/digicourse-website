<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiCourse LMS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7ff;
color:#182033
}

.hero{
padding:35px 6%;
color:white;
background:linear-gradient(135deg,#5b2cff,#8d4cff)
}

.hero h1{
margin:0 0 8px;
font-size:30px
}

.wrap{
padding:30px 6%
}

.box,.card{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 6px 22px #0001
}

.box{
max-width:430px;
margin:10px auto
}

.box input{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px
}

.btn{
width:100%;
padding:13px;
margin-top:8px;
background:#6633ee;
color:white;
border:0;
border-radius:9px;
font-size:16px;
cursor:pointer
}

.btn:active{
transform:scale(.98)
}

.logout{
width:auto;
padding:10px 18px;
background:#e53935
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px
}

.lesson{
margin-top:12px;
padding:15px;
background:#f1efff;
border-radius:10px
}

.hidden{
display:none!important
}

.msg{
margin-top:12px;
font-weight:bold
}

.success{
color:green
}

.error{
color:#d00
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px
}

.price{
font-size:20px;
font-weight:bold;
color:#6633ee
}

.purchased{
color:#159447;
font-weight:bold;
margin:12px 0
}

a{
color:#6633ee;
text-decoration:none;
font-weight:bold;
margin-right:15px
}

.no-course{
text-align:center;
padding:30px
}
</style>
</head>

<body>

<section class="hero">
<h1>🎓 DigiCourse LMS</h1>
<p>Student Learning Portal</p>
</section>

<main class="wrap">

<!-- ================= LOGIN ================= -->

<div id="login" class="box">

<h2>👨‍🎓 Student Login / Register</h2>

<input
id="name"
type="text"
placeholder="Student Name">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="btn"
id="loginBtn"
onclick="loginStudent()">

Login / Register

</button>

<p id="msg" class="msg"></p>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="hidden">

<div class="topbar">

<div>

<h2>
Welcome,
<span id="welcome"></span> 👋
</h2>

<p>🎓 Student Dashboard</p>

</div>

<button
class="btn logout"
onclick="logoutStudent()">

Logout

</button>

</div>


<h2>📚 My Purchased Courses</h2>

<p>
यहाँ केवल आपके खरीदे हुए courses दिखाई देंगे।
</p>

<div
id="courses"
class="cards">

⏳ Courses loading...

</div>

</div>

</main>


<script>

/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
"https://qobwcoopjubdloduxgrz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4CUQ-Y8BWK7N_0rXZYJFDg_kLkcnbQJ";


/* ==========================================
   ELEMENTS
========================================== */

const loginBox =
document.getElementById("login");

const dashboard =
document.getElementById("dashboard");

const nameInput =
document.getElementById("name");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const msg =
document.getElementById("msg");

const welcome =
document.getElementById("welcome");

const courses =
document.getElementById("courses");


/* ==========================================
   SUPABASE REQUEST
========================================== */

async function supabaseRequest(
endpoint,
options={}
){

const response =
await fetch(
SUPABASE_URL + endpoint,
{
...options,

headers:{
"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " +
(
localStorage.getItem("dc_access_token")
||
SUPABASE_KEY
),

"Content-Type":
"application/json",

...(options.headers || {})
}
}
);

const text =
await response.text();

let data=null;

try{

data =
text
?
JSON.parse(text)
:
null;

}
catch{

data=text;

}


if(!response.ok){

throw new Error(
data?.message ||
data?.msg ||
data?.error_description ||
data?.hint ||
data?.error ||
text ||
"Supabase Error"
);

}

return data;

}


/* ==========================================
   STUDENT LOGIN / REGISTER
========================================== */

async function loginStudent(){

const name =
nameInput.value.trim();

const email =
emailInput.value.trim().toLowerCase();

const password =
passwordInput.value;

msg.textContent="";
msg.className="msg";


if(!name){

msg.textContent=
"❌ Student Name भरें";

msg.classList.add("error");

return;

}


if(!email){

msg.textContent=
"❌ Email भरें";

msg.classList.add("error");

return;

}


if(
!password ||
password.length < 6
){

msg.textContent=
"❌ Password कम से कम 6 characters का होना चाहिए";

msg.classList.add("error");

return;

}


loginBtn.disabled=true;

loginBtn.textContent=
"⏳ Please wait...";


try{

let loginData;


/* ==========================================
   पहले LOGIN
========================================== */

try{

loginData =
await supabaseRequest(
"/auth/v1/token?grant_type=password",
{
method:"POST",

body:
JSON.stringify({

email:email,

password:password

})
}
);

}


/* ==========================================
   LOGIN FAIL → REGISTER
========================================== */

catch(loginError){

loginData =
await supabaseRequest(
"/auth/v1/signup",
{
method:"POST",

body:
JSON.stringify({

email:email,

password:password,

data:{
name:name
}

})
}
);


/*
अगर email confirmation ON है
तो access token नहीं मिलेगा
*/

if(!loginData?.access_token){

throw new Error(
"Registration हो गया है। पहले Email verify करें, फिर Login करें।"
);

}

}


/* ==========================================
   TOKEN SAVE
========================================== */

if(
!loginData?.access_token
){

throw new Error(
"Student login session नहीं मिली।"
);

}


localStorage.setItem(
"dc_access_token",
loginData.access_token
);


localStorage.setItem(
"dc_user",
JSON.stringify(
loginData.user || {}
)
);


/* ==========================================
   STUDENT TABLE
========================================== */

try{

await supabaseRequest(
"/rest/v1/students",
{
method:"POST",

headers:{
"Prefer":
"resolution=merge-duplicates"
},

body:
JSON.stringify({

id:
loginData.user.id,

name:name,

email:email

})
}
);

}
catch(error){

console.log(
"Student table:",
error
);

}


/* ==========================================
   DASHBOARD
========================================== */

loginBox.classList.add("hidden");

dashboard.classList.remove("hidden");

welcome.textContent =
name ||
loginData.user?.user_metadata?.name ||
"Student";

msg.textContent="";


await loadCourses();

}
catch(error){

console.error(error);

msg.textContent=
"❌ " + error.message;

msg.classList.add("error");

}


loginBtn.disabled=false;

loginBtn.textContent=
"Login / Register";

}


/* ==========================================
   LOAD ONLY PURCHASED COURSES
========================================== */

async function loadCourses(){

courses.innerHTML =
"⏳ आपके purchased courses loading...";


try{

const token =
localStorage.getItem(
"dc_access_token"
);


if(!token){

throw new Error(
"Student login required"
);

}


const user =
JSON.parse(
localStorage.getItem(
"dc_user"
) || "{}"
);


if(!user.id){

throw new Error(
"Student session नहीं मिली"
);

}


/* ==========================================
   CHECK STUDENT COURSES
========================================== */

const enrollments =
await supabaseRequest(

"/rest/v1/student_courses" +

"?student_id=eq." +

encodeURIComponent(
user.id
) +

"&select=course_id"

);


/* ==========================================
   NO PURCHASE
========================================== */

if(
!enrollments ||
enrollments.length===0
){

courses.innerHTML = `

<div class="card no-course">

<h2>📚 अभी कोई Course नहीं है</h2>

<p>
आपने अभी कोई course purchase नहीं किया है।
</p>

<button
class="btn"
onclick="goToCourses()">

🛒 Course खरीदें

</button>

</div>

`;

return;

}


/* ==========================================
   COURSE IDS
========================================== */

const ids =
enrollments
.map(
item =>
item.course_id
)
.filter(Boolean);


if(ids.length===0){

courses.innerHTML = `

<div class="card no-course">

📚 कोई purchased course नहीं मिला।

</div>

`;

return;

}


/* ==========================================
   PURCHASED COURSES FETCH
========================================== */

const courseData =
await supabaseRequest(

"/rest/v1/courses" +

"?id=in.(" +

ids.join(",") +

")" +

"&select=id,title,description,price,original_price,offer_price"

);


/* ==========================================
   COURSES NOT FOUND
========================================== */

if(
!courseData ||
courseData.length===0
){

courses.innerHTML = `

<div class="card no-course">

📚 आपका purchased course अभी उपलब्ध नहीं है।

</div>

`;

return;

}


/* ==========================================
   SHOW PURCHASED COURSES
========================================== */

courses.innerHTML =

courseData
.map(
course => `

<div class="card">

<h3>
📚 ${escapeHTML(
course.title
)}
</h3>

<p>
${escapeHTML(
course.description || ""
)}
</p>


<div class="price">

₹${
course.offer_price ??
course.price ??
0
}

</div>


<div class="purchased">

✅ Purchased

</div>


<button
class="btn"
onclick="openMyCourse(
'${course.id}',
this
)">

📖 Open My Course

</button>


<div class="lessonBox"></div>

</div>

`
)
.join("");


}
catch(error){

console.error(error);

courses.innerHTML = `

<div class="card">

❌ Courses load नहीं हो पाए।

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* ==========================================
   OPEN MY COURSE
========================================== */

async function openMyCourse(
courseId,
button
){

const box =
button.parentElement
.querySelector(
".lessonBox"
);


if(
box.innerHTML.trim() !== ""
){

box.innerHTML="";

return;

}


box.innerHTML =
"⏳ Lessons loading...";


try{

/*
पहले verify करें कि
student ने यह course खरीदा है
*/

const user =
JSON.parse(
localStorage.getItem(
"dc_user"
) || "{}"
);


const check =
await supabaseRequest(

"/rest/v1/student_courses" +

"?student_id=eq." +

encodeURIComponent(
user.id
) +

"&course_id=eq." +

encodeURIComponent(
courseId
) +

"&select=course_id"

);


if(
!check ||
check.length===0
){

throw new Error(
"यह course आपके account में purchased नहीं है।"
);

}


/* ==========================================
   LESSONS
========================================== */

const data =
await supabaseRequest(

"/rest/v1/lessons" +

"?course_id=eq." +

encodeURIComponent(
courseId
) +

"&select=title,description,video_url,pdf_url,lesson_order" +

"&order=lesson_order.asc"

);


if(
!data ||
data.length===0
){

box.innerHTML = `

<div class="lesson">

📖 इस course में अभी कोई lesson नहीं है।

</div>

`;

return;

}


/* ==========================================
   LESSON DISPLAY
========================================== */

box.innerHTML =

data
.map(
(lesson,index) => `

<div class="lesson">

<b>

📖 Lesson ${
lesson.lesson_order ||
index+1
}

:

${escapeHTML(
lesson.title
)}

</b>


<p>

${escapeHTML(
lesson.description || ""
)}

</p>


${
lesson.video_url
?
`

<a
href="${escapeAttribute(
lesson.video_url
)}"
target="_blank"
rel="noopener">

🎥 Watch Video

</a>

`
:
""
}


${
lesson.pdf_url
?
`

<a
href="${escapeAttribute(
lesson.pdf_url
)}"
target="_blank"
rel="noopener">

📄 Open PDF

</a>

`
:
""
}

</div>

`
)
.join("");


}
catch(error){

box.innerHTML = `

<div class="lesson error">

❌ Course open नहीं हो पाया।

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* ==========================================
   GO TO HOME COURSES
========================================== */

function goToCourses(){

window.location.href =
"index.html#courses";

}


/* ==========================================
   LOGOUT
========================================== */

function logoutStudent(){

localStorage.removeItem(
"dc_access_token"
);

localStorage.removeItem(
"dc_user"
);

dashboard.classList.add(
"hidden"
);

loginBox.classList.remove(
"hidden"
);

nameInput.value="";
emailInput.value="";
passwordInput.value="";

msg.textContent="";

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/[&<>"']/g,

function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

}
);

}


function escapeAttribute(value){

return String(
value ?? ""
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#39;"
);

}


/* ==========================================
   AUTO LOGIN SESSION
========================================== */

async function restoreStudent(){

const token =
localStorage.getItem(
"dc_access_token"
);

const savedUser =
localStorage.getItem(
"dc_user"
);


if(
!token ||
!savedUser
){

return;

}


try{

const user =
JSON.parse(savedUser);


if(!user.id){

return;

}


loginBox.classList.add(
"hidden"
);

dashboard.classList.remove(
"hidden"
);

welcome.textContent =
user.user_metadata?.name ||
user.name ||
"Student";


await loadCourses();

}
catch(error){

console.log(
"Restore session:",
error
);

}

}


/* ==========================================
   START
========================================== */

restoreStudent();

console.log(
"DigiCourse LMS loaded successfully"
);

</script>

</body>
</html>
