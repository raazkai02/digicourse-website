<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiCourse Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7ff;color:#182033}
header{background:linear-gradient(135deg,#5b2cff,#8d4cff);color:#fff;padding:28px 6%;box-shadow:0 5px 20px #0002}
header h1{margin:0 0 6px}
main{padding:25px 6%;max-width:1100px;margin:auto}
.box,.course{background:#fff;padding:20px;margin:18px 0;border-radius:16px;box-shadow:0 6px 22px #0001}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #d5d8e5;border-radius:9px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
button{padding:12px 18px;border:0;border-radius:9px;background:#6633ee;color:#fff;font-size:15px;cursor:pointer;margin:5px 3px}
button:hover{opacity:.9}
.red{background:#e53935}.green{background:#159447}.orange{background:#f57c00}.blue{background:#1976d2}
.hide{display:none!important}
.msg{font-weight:bold;margin-top:12px}
.lesson{background:#f0edff;padding:15px;margin:10px 0;border-radius:10px}
.price-box{background:#f7f4ff;padding:15px;border-radius:12px;margin:12px 0}
.original{text-decoration:line-through;color:#888}
.offer{color:#6633ee;font-size:24px;font-weight:bold}
.coupon{background:#eaf8ef;padding:12px;border-radius:9px;margin-top:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#6633ee;color:#fff;font-size:12px;margin:3px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.editbox{background:#fff8e8;border:1px solid #ffd27a;padding:15px;border-radius:12px;margin-top:12px}
hr{border:0;border-top:1px solid #eee;margin:20px 0}
a{color:#6633ee;font-weight:bold;text-decoration:none;margin-right:12px}
</style>
</head>

<body>

<header>
<h1>🎓 DigiCourse Admin</h1>
<p>Course • Lesson • Offer • Coupon Management</p>
</header>

<main>

<!-- LOGIN -->
<div id="login" class="box">
<h2>🔐 Admin Login</h2>

<input id="email" type="email" placeholder="Admin Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="loginAdmin()">🔐 Login</button>
<button class="orange" onclick="showForgot()">🔑 Forgot Password?</button>

<p id="msg" class="msg"></p>
</div>


<!-- FORGOT -->
<div id="forgot" class="box hide">
<h2>🔑 Reset Admin Password</h2>

<input id="forgotEmail" type="email" placeholder="Admin Email">

<button onclick="sendReset()">📧 Send Reset Link</button>
<button class="orange" onclick="backLogin()">⬅ Back to Login</button>

<p id="forgotMsg" class="msg"></p>
</div>


<!-- NEW PASSWORD -->
<div id="newPassword" class="box hide">
<h2>🔄 Set New Password</h2>

<input id="newPass" type="password" placeholder="New Password">
<input id="newPass2" type="password" placeholder="Confirm New Password">

<button onclick="updatePassword()">🔐 Update Password</button>

<p id="newMsg" class="msg"></p>
</div>


<!-- PANEL -->
<div id="panel" class="hide">

<div class="topbar">
<div>
<h2>📚 Admin Dashboard</h2>
<p>Course और Lesson Management</p>
</div>

<button class="red" onclick="logout()">🚪 Logout</button>
</div>


<!-- ADD COURSE -->
<div class="box">

<h2>➕ Add New Course</h2>

<input id="ct" placeholder="Course Title">
<textarea id="cd" placeholder="Course Description"></textarea>

<h3>💰 Course Pricing</h3>

<input id="op" type="number" min="0" placeholder="Original Price ₹">
<input id="cp" type="number" min="0" placeholder="Offer Price ₹">

<h3>🎟️ Coupon / Discount</h3>

<input id="cc" placeholder="Coupon Code जैसे DIGI50">

<input id="cv" type="number" min="0" max="100"
placeholder="Discount %">

<label>Coupon Expiry:</label>
<input id="ce" type="datetime-local">

<input id="cl" type="number" min="0"
placeholder="Coupon Usage Limit (0 = Unlimited)">

<label style="display:block;margin:12px 0">
<input id="ca" type="checkbox" style="width:auto">
Coupon Active
</label>

<button onclick="addCourse()">🚀 Add Course</button>

</div>


<!-- COURSES -->
<div id="courses">⏳ Courses loading...</div>

</div>
</main>


<script>

const U="https://qobwcoopjubdloduxgrz.supabase.co";

const K="sb_publishable_4CUQ-Y8BWK7N_0rXZYJFDg_kLkcnbQJ";

let T=localStorage.getItem("admin_token")||"";


/* API */
async function api(path,opt={}){

const r=await fetch(U+path,{
...opt,
headers:{
apikey:K,
Authorization:"Bearer "+(T||K),
"Content-Type":"application/json",
...(opt.headers||{})
}
});

const text=await r.text();

let d=null;
try{d=text?JSON.parse(text):null}
catch{d=text}

if(!r.ok){
throw new Error(
d?.msg||d?.message||d?.hint||
d?.error_description||text||"Supabase Error"
);
}

return d;
}


/* LOGIN */
async function loginAdmin(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("pass").value;
const msg=document.getElementById("msg");

if(!email||!password){
msg.textContent="❌ Email और Password डालें";
return;
}

msg.textContent="⏳ Login हो रहा है...";

try{

const d=await api(
"/auth/v1/token?grant_type=password",
{
method:"POST",
body:JSON.stringify({
email:email,
password:password
})
}
);

T=d.access_token;

const a=await api(
"/rest/v1/admins?id=eq."+
encodeURIComponent(d.user.id)+
"&select=id,name"
);

if(!a.length)throw new Error("यह User Admin नहीं है");

localStorage.setItem("admin_token",T);
localStorage.setItem("admin_user_id",d.user.id);

showPanel();
load();

}catch(e){
msg.textContent="❌ "+e.message;
}
}


/* FORGOT */
function showForgot(){

document.getElementById("login").classList.add("hide");
document.getElementById("newPassword").classList.add("hide");
document.getElementById("forgot").classList.remove("hide");

const e=document.getElementById("email").value.trim();

if(e)document.getElementById("forgotEmail").value=e;
}


function backLogin(){

document.getElementById("forgot").classList.add("hide");
document.getElementById("newPassword").classList.add("hide");
document.getElementById("login").classList.remove("hide");
}


/* RESET EMAIL */
async function sendReset(){

const email=document.getElementById("forgotEmail").value.trim();
const msg=document.getElementById("forgotMsg");

if(!email){
msg.textContent="❌ Admin Email डालें";
return;
}

msg.textContent="⏳ Reset email भेजा जा रहा है...";

try{

const redirect=location.origin+location.pathname;

const r=await fetch(U+"/auth/v1/recover",{
method:"POST",
headers:{
apikey:K,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
redirect_to:redirect
})
});

const text=await r.text();

if(!r.ok){

let d;
try{d=JSON.parse(text)}catch{d={message:text}}

throw new Error(d.msg||d.message||text);
}

msg.textContent="✅ Reset link भेज दिया गया। Email check करें।";

}catch(e){
msg.textContent="❌ "+e.message;
}
}


/* RECOVERY */
function checkRecoveryLink(){

const hash=location.hash.substring(1);

if(!hash)return;

const p=new URLSearchParams(hash);

if(p.get("type")==="recovery"&&p.get("access_token")){

T=p.get("access_token");

document.getElementById("login").classList.add("hide");
document.getElementById("forgot").classList.add("hide");
document.getElementById("newPassword").classList.remove("hide");
}
}


/* UPDATE PASSWORD */
async function updatePassword(){

const p1=document.getElementById("newPass").value;
const p2=document.getElementById("newPass2").value;
const msg=document.getElementById("newMsg");

if(!p1||!p2){
msg.textContent="❌ दोनों password डालें";
return;
}

if(p1.length<6){
msg.textContent="❌ Password कम से कम 6 characters का रखें";
return;
}

if(p1!==p2){
msg.textContent="❌ दोनों password समान नहीं हैं";
return;
}

msg.textContent="⏳ Updating...";

try{

await api("/auth/v1/user",{
method:"PUT",
body:JSON.stringify({password:p1})
});

msg.textContent="✅ Password successfully update हो गया।";

setTimeout(()=>{
history.replaceState(null,"",location.pathname);
backLogin();
},1200);

}catch(e){
msg.textContent="❌ "+e.message;
}
}


/* PANEL */
function showPanel(){

document.getElementById("login").classList.add("hide");
document.getElementById("forgot").classList.add("hide");
document.getElementById("newPassword").classList.add("hide");
document.getElementById("panel").classList.remove("hide");
}


/* RESTORE */
async function restoreSession(){

if(!T)return;

try{

const user=await api("/auth/v1/user");

const a=await api(
"/rest/v1/admins?id=eq."+
encodeURIComponent(user.id)+
"&select=id,name"
);

if(a.length){
showPanel();
load();
}

}catch(e){

T="";

localStorage.removeItem("admin_token");
localStorage.removeItem("admin_user_id");
}
}


/* LOAD COURSES */
async function load(){

const box=document.getElementById("courses");

box.innerHTML="⏳ Courses loading...";

try{

const courses=await api(
"/rest/v1/courses?select=*&order=created_at.desc"
);

if(!courses.length){

box.innerHTML=`
<div class="box">
<h3>📚 अभी कोई Course नहीं है</h3>
</div>`;
return;
}

box.innerHTML=courses.map(courseHTML).join("");

courses.forEach(c=>lessons(c.id));

}catch(e){

box.innerHTML=`
<div class="box">❌ ${esc(e.message)}</div>`;
}
}


/* COURSE HTML */
function courseHTML(c){

const original=Number(c.original_price||0);
const offer=Number(c.offer_price??c.price??0);

return`

<div class="course">

<h2>📚 ${esc(c.title)}</h2>

<p>${esc(c.description||"")}</p>

<div class="price-box">

${original>offer?
`<div class="original">Original Price: ₹${original}</div>`:""}

<div class="offer">🔥 Offer Price: ₹${offer}</div>

${original>offer?
`<span class="badge">SAVE ₹${original-offer}</span>`:""}

</div>

${c.coupon_code?`
<div class="coupon">
🎟️ Coupon: <b>${esc(c.coupon_code)}</b>
<br>
💸 Discount: ${Number(c.coupon_value||0)}%
<br>
${c.coupon_active?"🟢 Active":"🔴 Inactive"}
</div>`:""}

<hr>

<button class="blue"
onclick="toggleCourseEdit('${c.id}')">
✏️ Edit Course / Offer
</button>

<button
onclick="toggleAddLesson('${c.id}')">
➕ Add Lesson
</button>

<button class="red"
onclick="deleteCourse('${c.id}')">
🗑️ Delete Course
</button>


<!-- COURSE EDIT -->
<div id="courseEdit_${c.id}" class="editbox hide">

<h3>✏️ Edit Course / Offer / Coupon</h3>

<input id="title_${c.id}"
value="${escAttr(c.title)}"
placeholder="Course Title">

<textarea id="desc_${c.id}"
placeholder="Description">${esc(c.description||"")}</textarea>

<h3>💰 Pricing</h3>

<input id="original_${c.id}"
type="number"
value="${original}"
placeholder="Original Price">

<input id="offer_${c.id}"
type="number"
value="${offer}"
placeholder="Offer Price">

<h3>🎟️ Coupon</h3>

<input id="coupon_${c.id}"
value="${escAttr(c.coupon_code||"")}"
placeholder="Coupon Code">

<input id="discount_${c.id}"
type="number"
min="0"
max="100"
value="${Number(c.coupon_value||0)}"
placeholder="Discount %">

<label>Coupon Expiry</label>

<input id="expiry_${c.id}"
type="datetime-local"
value="${dateTimeLocal(c.coupon_expiry)}">

<input id="limit_${c.id}"
type="number"
min="0"
value="${Number(c.coupon_limit||0)}"
placeholder="Usage Limit">

<label style="display:block;margin:12px 0">

<input id="active_${c.id}"
type="checkbox"
style="width:auto"
${c.coupon_active?"checked":""}>

Coupon Active

</label>

<button class="green"
onclick="saveCourse('${c.id}')">
💾 Save Course
</button>

</div>


<!-- ADD LESSON -->
<div id="addLesson_${c.id}" class="editbox hide">

<h3>➕ Add New Lesson</h3>

<input id="newTitle_${c.id}"
placeholder="Lesson Title">

<textarea id="newDesc_${c.id}"
placeholder="Lesson Description"></textarea>

<input id="newVideo_${c.id}"
placeholder="YouTube Video URL">

<input id="newPdf_${c.id}"
placeholder="PDF URL">

<input id="newOrder_${c.id}"
type="number"
min="1"
placeholder="Lesson Order">

<button class="green"
onclick="saveNewLesson('${c.id}')">
💾 Save Lesson
</button>

</div>


<h3>📖 Existing Lessons</h3>

<div id="lessons_${c.id}">
⏳ Lessons loading...
</div>

</div>`;
}


/* COURSE EDIT TOGGLE */
function toggleCourseEdit(id){

document
.getElementById("courseEdit_"+id)
.classList.toggle("hide");

}


/* SAVE COURSE */
async function saveCourse(id){

try{

const title=document.getElementById("title_"+id).value.trim();
const desc=document.getElementById("desc_"+id).value.trim();

const original=Number(
document.getElementById("original_"+id).value
)||0;

const offer=Number(
document.getElementById("offer_"+id).value
)||0;

const coupon=document.getElementById("coupon_"+id)
.value.trim().toUpperCase();

const discount=Number(
document.getElementById("discount_"+id).value
)||0;

const expiry=document.getElementById("expiry_"+id).value||null;

const limit=Number(
document.getElementById("limit_"+id).value
)||0;

const active=document.getElementById("active_"+id).checked;

if(!title){
alert("❌ Course Title डालें");
return;
}

if(original>0&&offer>original){
alert("❌ Offer Price Original Price से ज्यादा नहीं हो सकता");
return;
}

if(discount<0||discount>100){
alert("❌ Discount 0 से 100% रखें");
return;
}

await api(
"/rest/v1/courses?id=eq."+encodeURIComponent(id),
{
method:"PATCH",
headers:{Prefer:"return=minimal"},
body:JSON.stringify({
title:title,
description:desc,
price:offer,
original_price:original,
offer_price:offer,
coupon_code:coupon||null,
coupon_type:"percent",
coupon_value:discount,
coupon_expiry:expiry,
coupon_limit:limit,
coupon_active:active
})
}
);

alert("✅ Course successfully update हो गया");

load();

}catch(e){

alert("❌ "+e.message);

}
}


/* ADD COURSE */
async function addCourse(){

try{

const title=document.getElementById("ct").value.trim();
const desc=document.getElementById("cd").value.trim();

const original=Number(document.getElementById("op").value)||0;
const offer=Number(document.getElementById("cp").value)||0;

const coupon=document.getElementById("cc").value
.trim().toUpperCase();

const discount=Number(document.getElementById("cv").value)||0;

const expiry=document.getElementById("ce").value||null;
const limit=Number(document.getElementById("cl").value)||0;

const active=document.getElementById("ca").checked;

if(!title){
alert("❌ Course Title डालें");
return;
}

if(original>0&&offer>original){
alert("❌ Offer Price Original Price से ज्यादा नहीं हो सकता");
return;
}

if(discount>100){
alert("❌ Discount 100% से ज्यादा नहीं");
return;
}

await api("/rest/v1/courses",{
method:"POST",
headers:{Prefer:"return=minimal"},
body:JSON.stringify({
title:title,
description:desc,
price:offer,
original_price:original,
offer_price:offer,
coupon_code:coupon||null,
coupon_type:"percent",
coupon_value:discount,
coupon_expiry:expiry,
coupon_limit:limit,
coupon_active:active
})
});

alert("✅ Course successfully add हो गया");

["ct","cd","op","cp","cc","cv","ce","cl"]
.forEach(id=>document.getElementById(id).value="");

document.getElementById("ca").checked=false;

load();

}catch(e){

alert("❌ "+e.message);

}
}


/* ADD LESSON FORM */
function toggleAddLesson(id){

document
.getElementById("addLesson_"+id)
.classList.toggle("hide");

}


/* SAVE NEW LESSON */

try{

const title=document
.getElementById("newTitle_"+courseId)
.value.trim();

const desc=document
.getElementById("newDesc_"+courseId)
.value.trim();

const video=document
.getElementById("newVideo_"+courseId)
.value.trim();

.getElementById("newPdf_"+courseId)

/* LOAD EXISTING LESSONS */
async function lessons(courseId){

const box=document.getElementById("lessons_"+courseId);

if(!box)return;

try{

const data=await api(
"/rest/v1/lessons"+
"?course_id=eq."+encodeURIComponent(courseId)+
"&select=id,title,description,video_url,pdf_url,lesson_order"+
"&order=lesson_order.asc"
);

if(!data.length){

box.innerHTML=
`<div class="lesson">📖 अभी कोई lesson नहीं है।</div>`;

return;
}


/*
 IMPORTANT:
 Edit button सीधे toggleLessonEdit(id) चलाता है।
 कोई JSON object onclick में नहीं भेजा जा रहा।
*/

box.innerHTML=data.map(l=>`

<div class="lesson">

<b>
📖 Lesson ${esc(l.lesson_order||1)} :
${esc(l.title)}
</b>

<p>${esc(l.description||"")}</p>

${l.video_url?
`🎥 <a href="${safeURL(l.video_url)}" target="_blank">Watch Video</a>`
:""}

${l.pdf_url?
`📄 <a href="${safeURL(l.pdf_url)}" target="_blank">Open PDF</a>`
:""}

<br>

<button
class="blue"
onclick="toggleLessonEdit('${l.id}')">

✏️ Edit Lesson

</button>

<button
class="red"
onclick="deleteLesson('${l.id}','${courseId}')">

🗑️ Delete Lesson

</button>


<!-- EXISTING LESSON EDIT BOX -->
<div
id="lessonEdit_${l.id}"
class="editbox hide">

<h3>✏️ Edit Existing Lesson</h3>

<input
id="lessonTitle_${l.id}"
value="${escAttr(l.title)}"
placeholder="Lesson Title">

<textarea
id="lessonDesc_${l.id}"
placeholder="Lesson Description">${esc(l.description||"")}</textarea>

<input
id="lessonVideo_${l.id}"
value="${escAttr(l.video_url||"")}"
placeholder="YouTube Video URL">

<input
id="lessonPdf_${l.id}"
value="${escAttr(l.pdf_url||"")}"
placeholder="PDF URL">

<input
id="lessonOrder_${l.id}"
type="number"
min="1"
value="${Number(l.lesson_order||1)}"
placeholder="Lesson Order">

<button
class="green"
onclick="saveLessonEdit('${l.id}','${courseId}')">

💾 Save Changes

</button>

<button
class="orange"
onclick="toggleLessonEdit('${l.id}')">

Cancel

</button>

</div>

</div>

`).join("");

}catch(e){

box.innerHTML=
`<div class="lesson">❌ ${esc(e.message)}</div>`;

}
}

/* LOGOUT */
function logout(){

T="";

localStorage.removeItem("admin_token");
localStorage.removeItem("admin_user_id");

location.reload();

}


/* HELPERS */
function esc(v){

return String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}

function escAttr(v){
return esc(v);
}

function safeURL(v){

const u=String(v||"").trim();

if(!/^https?:\/\//i.test(u))return "#";

return u.replace(/"/g,"%22").replace(/'/g,"%27");
}

function dateTimeLocal(v){

if(!v)return "";

const d=new Date(v);

if(isNaN(d.getTime()))return "";

const p=n=>String(n).padStart(2,"0");

return d.getFullYear()+"-"+
p(d.getMonth()+1)+"-"+
p(d.getDate())+"T"+
p(d.getHours())+":"+
p(d.getMinutes());
}
