<div class="box">

<h3>➕ Add Course</h3>

<input id="ct" placeholder="Course Title">

<textarea id="cd" placeholder="Course Description"></textarea>

<h3>💰 Course Pricing</h3>

<input id="op" type="number" placeholder="Original Price ₹">

<input id="cp" type="number" placeholder="Offer Price ₹">

<h3>🎟️ Coupon / Discount</h3>

<input id="cc" placeholder="Coupon Code जैसे DIGI50">

<input id="cv" type="number" min="0" max="100"
placeholder="Discount %">

<label>Coupon Expiry:</label>

<input id="ce" type="datetime-local">

<input id="cl" type="number" min="0"
placeholder="Coupon Usage Limit">

<label style="display:block;margin:10px 0">
<input id="ca" type="checkbox" style="width:auto">
Coupon Active
</label>

<button onclick="addCourse()">
🚀 Add Course
</button>

</div>
