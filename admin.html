<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiCourse Admin</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7ff;
margin:0;
color:#182033
}
header{
background:linear-gradient(135deg,#5b2cff,#8d4cff);
color:white;
padding:25px
}
main{padding:20px}
.box,.course{
background:white;
padding:18px;
margin:15px 0;
border-radius:12px;
box-shadow:0 5px 18px #0001
}
input,textarea{
width:100%;
padding:12px;
margin:6px 0;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:8px
}
button{
padding:11px 15px;
border:0;
border-radius:8px;
background:#6633ee;
color:white;
margin:5px;
cursor:pointer
}
button:disabled{opacity:.6}
.red{background:#e53935}
.hide{display:none!important}
.lesson{
background:#f0edff;
padding:12px;
margin:8px 0;
border-radius:8px
}
a{
color:#6633ee;
font-weight:bold
}
.success{color:green;font-weight:bold}
.error{color:#d00;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🎓 DigiCourse Admin</h1>
<p>Course Management</p>
</header>

<main>

<!-- ================= LOGIN ================= -->

<div id="login" class="box">

<h2>🔐 Admin Login</h2>

<input
id="email"
type="email"
placeholder="Admin Email">

<input
id="pass"
type="password"
placeholder="Password">

<button onclick="loginAdmin()">
Login
</button>

<button onclick="showForgot()">
🔑 Forgot Password?
</button>

<p id="msg"></p>

</div>


<!-- ================= FORGOT PASSWORD ================= -->

<div id="forgot" class="box hide">

<h2>🔑 Reset Admin Password</h2>

<p>
Admin email डालें। Reset link Gmail पर आएगा।
</p>

<input
id="forgotEmail"
type="email"
placeholder="Admin Email">

<button id="resetBtn" onclick="sendReset()">
Send Reset Link
</button>

<button onclick="backLogin()">
Back to Login
</button>

<p id="forgotMsg"></p>

</div>


<!-- ================= NEW PASSWORD ================= -->

<div id="newPassword" class="box hide">

<h2>🔄 Set New Password</h2>

<p>
अपना नया password डालें।
</p>

<input
id="newPass"
type="password"
placeholder="New Password">

<input
id="newPass2"
type="password"
placeholder="Confirm New Password">

<button id="updateBtn" onclick="updatePassword()">
Update Password
</button>

<p id="newMsg"></p>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="panel" class="hide">

<h2>📚 Admin Dashboard</h2>

<button class="red" onclick="logout()">
Logout
</button>


<div class="box">

<h3>➕ Add Course</h3>

<input
id="ct"
placeholder="Course Title">

<textarea
id="cd"
placeholder="Course Description"></textarea>

<input
id="cp"
type="number"
placeholder="Price">

<button onclick="addCourse()">
Add Course
</button>

</div>

<div id="courses"></div>

</div>

</main>


<script>

/* =================================================
   SUPABASE CONFIG
================================================= */

const U =
"https://qobwcoopjubdloduxgrz.supabase.co";

const K =
"sb_publishable_4CUQ-Y8BWK7N_0rXZYJFDg_kLkcnbQJ";


let T =
localStorage.getItem("admin_token") || "";


/* =================================================
   API
================================================= */

async function api(path,opt={}){

let r =
await fetch(U+path,{

...opt,

headers:{

apikey:K,

Authorization:
"Bearer "+(T || K),

"Content-Type":
"application/json",

...(opt.headers || {})

}

});

let text =
await r.text();

let d=null;

try{
d=text ? JSON.parse(text) : null;
}
catch{
d={message:text};
}

if(!r.ok){

throw Error(
d?.msg ||
d?.message ||
d?.error_description ||
d?.hint ||
text ||
"Supabase error"
);

}

return d;

}


/* =================================================
   ADMIN LOGIN
================================================= */

async function loginAdmin(){

let e =
document.getElementById("email")
.value.trim();

let p =
document.getElementById("pass")
.value;

let msg =
document.getElementById("msg");

msg.className="";

if(!e || !p){

msg.textContent =
"❌ Email और Password डालें";

msg.className="error";

return;
}

msg.textContent="Login...";

try{

let d =
await api(
"/auth/v1/token?grant_type=password",
{
method:"POST",

body:JSON.stringify({
email:e,
password:p
})
}
);

T=d.access_token;


/* Check admin */

let a =
await api(
"/rest/v1/admins?id=eq."
+
encodeURIComponent(d.user.id)
+
"&select=id,name"
);

if(!a.length){

throw Error(
"यह User Admin नहीं है"
);

}


localStorage.setItem(
"admin_token",
T
);

localStorage.setItem(
"admin_user_id",
d.user.id
);

showPanel();

load();

}
catch(x){

msg.textContent =
"❌ "+x.message;

msg.className="error";

}

}


/* =================================================
   FORGOT PASSWORD SCREEN
================================================= */

function showForgot(){

document
.getElementById("login")
.classList.add("hide");

document
.getElementById("newPassword")
.classList.add("hide");

document
.getElementById("forgot")
.classList.remove("hide");

document
.getElementById("forgotMsg")
.textContent="";


let oldEmail =
document
.getElementById("email")
.value.trim();

if(oldEmail){

document
.getElementById("forgotEmail")
.value=oldEmail;

}

}


/* =================================================
   BACK LOGIN
================================================= */

function backLogin(){

document
.getElementById("forgot")
.classList.add("hide");

document
.getElementById("newPassword")
.classList.add("hide");

document
.getElementById("login")
.classList.remove("hide");

}


/* =================================================
   SEND RESET EMAIL
================================================= */

async function sendReset(){

let e =
document
.getElementById("forgotEmail")
.value.trim();

let m =
document
.getElementById("forgotMsg");

let btn =
document
.getElementById("resetBtn");

if(!e){

m.textContent =
"❌ Admin Email डालें";

m.className="error";

return;
}

btn.disabled=true;

m.textContent =
"⏳ Reset email भेज रहे हैं...";

m.className="";


try{

/*
IMPORTANT:
Current admin.html URL को redirect URL बनाया गया है.
*/

let redirect =
window.location.origin +
window.location.pathname;


let r =
await fetch(
U+"/auth/v1/recover",
{
method:"POST",

headers:{
apikey:K,
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:e,

redirect_to:redirect

})

}
);


let text =
await r.text();

let d=null;

try{
d=text ? JSON.parse(text) : null;
}
catch{
d={message:text};
}


if(!r.ok){

throw Error(
d?.msg ||
d?.message ||
d?.error_description ||
text
);

}


m.textContent =
"✅ Reset link भेज दिया गया। Gmail में नया email खोलें।";

m.className="success";

}
catch(x){

m.textContent =
"❌ "+x.message;

m.className="error";

}

btn.disabled=false;

}


/* =================================================
   HANDLE SUPABASE RECOVERY LINK
================================================= */

function checkRecoveryLink(){

/*
Supabase पुराने/implicit recovery flow में
tokens URL hash (#...) में भेज सकता है.
*/

let hash =
window.location.hash.substring(1);

if(!hash){
return false;
}

let params =
new URLSearchParams(hash);

let type =
params.get("type");

let accessToken =
params.get("access_token");

let refreshToken =
params.get("refresh_token");

let error =
params.get("error");

let errorCode =
params.get("error_code");


/* Expired/invalid link */

if(error || errorCode){

document
.getElementById("login")
.classList.add("hide");

document
.getElementById("forgot")
.classList.add("hide");

document
.getElementById("newPassword")
.classList.remove("hide");

document
.getElementById("newMsg")
.textContent =
"❌ Reset link invalid या expired है। नया reset link भेजें।";

document
.getElementById("newMsg")
.className="error";

return true;

}


/* Recovery token */

if(
type==="recovery" &&
accessToken
){

T=accessToken;


/*
Save recovery token temporarily.
*/

localStorage.setItem(
"admin_recovery_token",
T
);


/*
If refresh token exists, save it too.
*/

if(refreshToken){

localStorage.setItem(
"admin_recovery_refresh",
refreshToken
);
}


/*
Show password screen.
*/

document
.getElementById("login")
.classList.add("hide");

document
.getElementById("forgot")
.classList.add("hide");

document
.getElementById("panel")
.classList.add("hide");

document
.getElementById("newPassword")
.classList.remove("hide");

document
.getElementById("newMsg")
.textContent =
"अब अपना नया password डालें।";

document
.getElementById("newMsg")
.className="success";


/*
Remove token from visible URL after reading it.
*/

history.replaceState(
null,
"",
window.location.pathname
);

return true;

}

return false;

}


/* =================================================
   UPDATE PASSWORD
================================================= */

async function updatePassword(){

let p1 =
document
.getElementById("newPass")
.value;

let p2 =
document
.getElementById("newPass2")
.value;

let m =
document
.getElementById("newMsg");

let btn =
document
.getElementById("updateBtn");


if(!p1 || !p2){

m.textContent =
"❌ दोनों password डालें";

m.className="error";

return;
}


if(p1.length < 6){

m.textContent =
"❌ Password कम से कम 6 characters का रखें";

m.className="error";

return;
}


if(p1 !== p2){

m.textContent =
"❌ दोनों password समान नहीं हैं";

m.className="error";

return;
}


/*
Recovery token first.
*/

let recoveryToken =
localStorage.getItem(
"admin_recovery_token"
);

if(recoveryToken){

T=recoveryToken;
}


if(!T){

m.textContent =
"❌ Recovery session नहीं मिला। नया reset link भेजें।";

m.className="error";

return;
}


btn.disabled=true;

m.textContent =
"⏳ Password update हो रहा है...";

m.className="";


try{

let r =
await fetch(
U+"/auth/v1/user",
{
method:"PUT",

headers:{
apikey:K,

Authorization:
"Bearer "+T,

"Content-Type":
"application/json"
},

body:JSON.stringify({

password:p1

})
}
);


let text =
await r.text();

let d=null;

try{
d=text ? JSON.parse(text) : null;
}
catch{
d={message:text};
}


if(!r.ok){

throw Error(
d?.msg ||
d?.message ||
d?.error_description ||
text
);

}


/*
Success
*/

m.textContent =
"✅ Password successfully update हो गया!";

m.className="success";


localStorage.removeItem(
"admin_recovery_token"
);

localStorage.removeItem(
"admin_recovery_refresh"
);


/*
Go back to login after 2 seconds.
*/

setTimeout(()=>{

T="";

document
.getElementById("newPass")
.value="";

document
.getElementById("newPass2")
.value="";

document
.getElementById("newPassword")
.classList.add("hide");

document
.getElementById("login")
.classList.remove("hide");

document
.getElementById("msg")
.textContent =
"✅ Password बदल गया। अब नए password से Login करें.";

document
.getElementById("msg")
.className="success";

},2000);


}
catch(x){

m.textContent =
"❌ "+x.message;

m.className="error";

}

btn.disabled=false;

}


/* =================================================
   SHOW ADMIN PANEL
================================================= */

function showPanel(){

document
.getElementById("login")
.classList.add("hide");

document
.getElementById("forgot")
.classList.add("hide");

document
.getElementById("newPassword")
.classList.add("hide");

document
.getElementById("panel")
.classList.remove("hide");

}


/* =================================================
   RESTORE ADMIN SESSION
================================================= */

async function restoreSession(){

if(!T){
return;
}

try{

let d =
await api(
"/auth/v1/user"
);

let a =
await api(
"/rest/v1/admins?id=eq."
+
encodeURIComponent(d.id)
+
"&select=id,name"
);


if(a.length){

showPanel();

load();

}

}
catch(e){

T="";

localStorage.removeItem(
"admin_token"
);

localStorage.removeItem(
"admin_user_id"
);

}

}


/* =================================================
   LOAD COURSES
================================================= */

async function load(){

try{

let a =
await api(
"/rest/v1/courses?select=id,title,description,price&order=created_at"
);

document
.getElementById("courses")
.innerHTML =

a.map(c=>`

<div class="course">

<h3>
📚 ${esc(c.title)}
</h3>

<p>
${esc(c.description||"")}
</p>

<b>
₹${c.price||0}
</b>

<br>

<button
onclick="show('${c.id}')">
➕ Add Lesson
</button>

<button
class="red"
onclick="del('${c.id}')">
🗑️ Delete
</button>


<div
id="f${c.id}"
class="hide">

<input
id="t${c.id}"
placeholder="Lesson Title">

<textarea
id="d${c.id}"
placeholder="Description">
</textarea>

<input
id="v${c.id}"
placeholder="Video URL">

<input
id="p${c.id}"
placeholder="PDF URL">

<button
onclick="lesson('${c.id}')">
💾 Save Lesson
</button>

</div>


<div id="l${c.id}">
Loading lessons...
</div>

</div>

`).join("");


a.forEach(
c=>lessons(c.id)
);

}
catch(x){

document
.getElementById("courses")
.textContent =
"❌ "+x.message;

}

}


/* =================================================
   ADD COURSE
================================================= */

async function addCourse(){

try{

await api(
"/rest/v1/courses",
{
method:"POST",

headers:{
Prefer:"return=minimal"
},

body:JSON.stringify({

title:
document
.getElementById("ct")
.value,

description:
document
.getElementById("cd")
.value,

price:
Number(
document
.getElementById("cp")
.value
)||0

})
}
);


document
.getElementById("ct")
.value="";

document
.getElementById("cd")
.value="";

document
.getElementById("cp")
.value="";

load();

}
catch(x){

alert(x.message);

}

}


/* =================================================
   SHOW LESSON FORM
================================================= */

function show(id){

document
.getElementById("f"+id)
.classList.toggle("hide");

}


/* =================================================
   ADD LESSON
================================================= */

async function lesson(id){

try{

await api(
"/rest/v1/lessons",
{
method:"POST",

headers:{
Prefer:"return=minimal"
},

body:JSON.stringify({

course_id:id,

title:
document
.getElementById("t"+id)
.value,

description:
document
.getElementById("d"+id)
.value,

video_url:
document
.getElementById("v"+id)
.value || null,

pdf_url:
document
.getElementById("p"+id)
.value || null,

lesson_order:1

})
}
);


alert(
"✅ Lesson add हो गया"
);

lessons(id);

}
catch(x){

alert(x.message);

}

}


/* =================================================
   LOAD LESSONS
================================================= */

async function lessons(id){

try{

let a =
await api(
"/rest/v1/lessons?course_id=eq."
+
encodeURIComponent(id)
+
"&select=id,title,description,video_url,pdf_url&order=lesson_order"
);


document
.getElementById("l"+id)
.innerHTML =

a.map(x=>`

<div class="lesson">

<b>
📖 ${esc(x.title)}
</b>

<p>
${esc(x.description||"")}
</p>

${
x.video_url
?
`🎥 <a href="${esc(x.video_url)}" target="_blank">Video</a>`
:
""
}

${
x.pdf_url
?
` 📄 <a href="${esc(x.pdf_url)}" target="_blank">PDF</a>`
:
""
}

</div>

`).join("")
||
"कोई lesson नहीं";

}
catch(x){

document
.getElementById("l"+id)
.textContent =
"❌ "+x.message;

}

}


/* =================================================
   DELETE COURSE
================================================= */

async function del(id){

if(!confirm("Course delete करें?")){
return;
}

try{

await api(
"/rest/v1/courses?id=eq."
+
encodeURIComponent(id),
{
method:"DELETE"
}
);

load();

}
catch(x){

alert(x.message);

}

}


/* =================================================
   LOGOUT
================================================= */

function logout(){

T="";

localStorage.removeItem(
"admin_token"
);

localStorage.removeItem(
"admin_user_id"
);

localStorage.removeItem(
"admin_recovery_token"
);

localStorage.removeItem(
"admin_recovery_refresh"
);

location.reload();

}


/* =================================================
   ESCAPE HTML
================================================= */

function esc(s){

return String(s||"")
.replace(
/[&<>"']/g,

m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m])

);

}


/* =================================================
   START
================================================= */

(function(){

/*
First check whether this is a password
recovery link.
*/

let recovery =
checkRecoveryLink();


/*
Only restore normal admin session if this
is NOT a recovery link.
*/

if(!recovery){

restoreSession();

}

})();

</script>

</body>
</html>
