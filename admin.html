<div class="box">

<h3>➕ Add Course</h3>

<input id="ct" placeholder="Course Title">

<textarea
id="cd"
placeholder="Course Description"></textarea>

<h4>💰 Pricing</h4>

<input
id="op"
type="number"
placeholder="Original Price ₹">

<input
id="cp"
type="number"
placeholder="Offer Price ₹">

<h4>🎟️ Coupon</h4>

<input
id="cc"
placeholder="Coupon Code (Example: DIGI50)">

<input
id="cv"
type="number"
placeholder="Discount %">

<input
id="ce"
type="datetime-local"
placeholder="Coupon Expiry">

<input
id="cl"
type="number"
placeholder="Usage Limit">

<label>
<input
id="ca"
type="checkbox"
style="width:auto">
 Coupon Active
</label>

<br><br>

<button onclick="addCourse()">
🚀 Add Course
</button>

</div>
